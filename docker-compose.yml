services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sst_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sst_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sst_saas?schema=public
      APP_URL: http://localhost:3000
      RUN_DB_SCHEMA_SYNC: "true"
    ports:
      - "3000:3000"
    volumes:
      - app_storage:/app/.data/storage
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["node", "--import", "tsx", "src/worker/index.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sst_saas?schema=public
      APP_URL: http://localhost:3000
      RUN_DB_SCHEMA_SYNC: "false"
    volumes:
      - app_storage:/app/.data/storage
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  app_storage:
